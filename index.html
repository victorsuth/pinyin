<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拼音大冒险</title>
<style>
:root{color-scheme:light;
  --green:#58cc02;--green-d:#46a302;--green-bg:#d7ffb8;
  --red:#ff4b4b;--red-d:#d33131;--red-bg:#ffdfe0;
  --blue:#1cb0f6;--blue-d:#1899d6;--blue-bg:#ddf4ff;
  --orange:#ff9600;--orange-d:#e08400;
  --yellow:#ffc800;--bg:#f7f7f7;--card:#fff;--line:#e5e5e5;--text:#3c3c3c;--muted:#8a8a8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
button{font-family:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-block:14px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.han{font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif}
.py{font-family:"Arial Rounded MT Bold","Helvetica Rounded","Avenir Next","Segoe UI",Arial,sans-serif;letter-spacing:.5px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px;white-space:nowrap}
.chip.fire{color:var(--orange)} .chip.xp{color:#e3a400} .chip.goal{color:var(--blue-d)}

.title{text-align:center;font-size:32px;margin:22px 0 4px;letter-spacing:2px}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;
  padding:14px 10px 12px;text-align:center;transition:transform .08s}
.cat:active{transform:translateY(3px);border-bottom-width:2px}
.cat .emoji{font-size:34px}
.cat .cname{font-size:18px;font-weight:800;margin-top:4px}
.cat.wide{grid-column:1/-1;background:#fff8e1;border-color:var(--yellow)}
.cat .cdesc{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.stars{color:var(--yellow);font-size:18px;margin-top:4px;letter-spacing:2px}
.stars .off{color:#ddd}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.big{border:none;border-radius:16px;padding:14px 12px;font-size:18px;font-weight:800;color:#fff;
  border-bottom:5px solid rgba(0,0,0,.18);transition:transform .08s}
.big:active{transform:translateY(3px);border-bottom-width:2px}
.big.green{background:var(--green)} .big.red{background:var(--red)} .big.blue{background:var(--blue)}
.big.orange{background:var(--orange)} .big.gray{background:#cfcfcf}
.big[disabled]{opacity:.7;cursor:default}
.pic{font-size:84px;line-height:1.1}
.hanmid{font-size:64px;line-height:1.15}
.minispk{margin-top:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;
  padding:6px 16px;font-size:16px;font-weight:700;color:var(--blue-d)}
.opt.picopt{padding:12px 4px 10px}
.opt .em{font-size:48px;line-height:1.1}
.opt .emw{font-size:20px;font-weight:400;color:var(--muted);margin-top:2px}
.diag{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.7}
.mutetip{background:#fff4d6;border:2px solid var(--yellow);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:15px;line-height:1.5;color:#7a5a00;text-align:left}
.mutetip.small{font-size:13px;padding:7px 10px;margin-top:12px}
.speedrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.spd{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--text)}
.spd.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.spd.test{color:var(--blue-d)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;line-height:1.6}

/* lesson */
.lhead{display:flex;align-items:center;gap:12px}
.xbtn{background:none;border:none;font-size:26px;color:#aaa;padding:0 4px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.combo{min-width:62px;text-align:right;font-weight:800;color:var(--orange);font-size:15px}
.qlabel{font-size:20px;font-weight:800;margin:26px 0 10px}
.prompt{text-align:center;margin:10px 0 22px}
.hanbig{font-size:110px;line-height:1.1}
.pybig{font-size:64px;font-weight:700;margin:22px 0;color:var(--blue-d)}
.word{font-size:26px;color:var(--muted);margin-top:4px}
.word b{color:var(--text)}
.speaker{width:120px;height:120px;border-radius:30px;border:none;background:var(--blue);color:#fff;font-size:56px;
  border-bottom:6px solid var(--blue-d);margin:14px auto 8px;display:block}
.speaker:active{transform:translateY(3px);border-bottom-width:3px}
.hint{color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;
  padding:16px 6px;font-size:32px;font-weight:700;color:var(--text);position:relative;min-height:80px}
.opt.hanopt{font-size:46px;font-weight:400}
.opt .tn{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px;font-family:sans-serif;letter-spacing:0}
.tonedemo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;font-size:15px;font-weight:700}
.opt .k{position:absolute;left:10px;top:8px;font-size:12px;color:#bbb;font-family:sans-serif;font-weight:700;
  border:2px solid var(--line);border-radius:6px;padding:0 5px}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.opt.bad{background:var(--red-bg);border-color:var(--red);color:var(--red-d);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;animation:up .2s ease-out}
.sheet.ok{background:var(--green-bg)} .sheet.bad{background:var(--red-bg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-in{max-width:560px;margin:0 auto}
.fb-title{font-size:22px;font-weight:800}
.sheet.ok .fb-title{color:var(--green-d)} .sheet.bad .fb-title{color:var(--red-d)}
.fb-detail{font-size:20px;margin:6px 0}
.sheet.bad .fb-detail{color:var(--red-d)}
.fb-detail .han{font-size:28px}
.tip{background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.55;margin:6px 0}
.sheet-btns{display:flex;gap:10px;margin-top:10px}
.sheet-btns .big{flex:1}
.iconbtn{border:none;border-radius:16px;background:#fff;font-size:24px;width:62px;border-bottom:5px solid rgba(0,0,0,.12)}

/* result */
.result{text-align:center;padding-top:30px}
.result .emo{font-size:90px}
.result h2{font-size:30px;margin:8px 0}
.bigstars{font-size:52px;color:var(--yellow);letter-spacing:6px}
.bigstars .off{color:#ddd}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 4px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.rbtns{display:flex;flex-direction:column;gap:12px;margin-top:10px}

/* 听音连连看 */
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:64px;margin-top:18px}
.bcol{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lines line{stroke:var(--green);stroke-width:6;stroke-linecap:round}
.lspk,.lcard{height:72px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-weight:800}
.lspk{font-size:30px;color:var(--blue-d);position:relative}
.lspk span{position:absolute;left:10px;top:6px;font-size:13px;color:#bbb;font-family:sans-serif}
.lcard{font-size:34px;color:var(--text)}
.lspk.sel{background:var(--blue-bg);border-color:var(--blue)}
.lspk.done,.lcard.done{background:var(--green-bg);border-color:var(--green);color:var(--green-d)}
.lcard.bad{background:var(--red-bg);border-color:var(--red);color:var(--red-d);animation:shake .35s}
/* 拼一拼 */
.slots{display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px;font-weight:800;color:var(--muted);margin:4px 0 14px}
.slot{min-width:72px;height:60px;border:2px dashed #c9c9c9;border-radius:14px;background:var(--card);font-size:30px;font-weight:700;
  color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.slot.res{border-style:solid;min-width:96px;color:var(--blue-d)}
.slot.res.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
.slot.res.bad{border-color:var(--red);background:var(--red-bg);color:var(--red-d)}
.tlabel{font-size:14px;font-weight:700;color:var(--muted);margin:8px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 2px;font-size:26px;font-weight:700;color:var(--text)}
.tile:active{transform:translateY(3px);border-bottom-width:2px}
.tile.sel{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-d)}
/* exam */
.bsub{font-size:13px;font-weight:600;opacity:.92;margin-top:3px}
.opt.sel{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-d)}
.score{font-size:76px;font-weight:800;line-height:1.1;color:var(--blue-d)}
.score span{font-size:26px;margin-left:4px}
.sec{text-align:left;font-size:18px;font-weight:800;margin:22px 0 10px}
.catrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;text-align:left}
.catrow .cn{width:96px;white-space:nowrap;font-weight:700}
.catrow .bar{height:12px}
.catrow .bar>i.low{background:var(--orange)}
.catrow .cv{width:42px;text-align:right;color:var(--muted);font-weight:700}
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:8px 12px;text-align:left;font-size:16px;color:var(--text);width:100%}
.witem .we{font-size:30px;min-width:36px;text-align:center}
.witem .wh{font-size:30px}
.witem .wd{flex:1;line-height:1.45}
.witem .no{color:var(--red-d);text-decoration:line-through}
.witem .yes{color:var(--green-d);font-weight:700}

.confetti{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>

    ]},
  shape:{name:'形近字母',emoji:'🔍',desc:'b d p q  m n  f t',types:['c2p','listen','p2c'],
    tip:'右下半圆 b，左下半圆 d，右上半圆 p，左上半圆 q。一个门洞 n，两个门洞 m。',

const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',v:'ǖǘǚǜ'};
function py(s){
  const m=s.match(/^([a-zv]+)([0-5])$/); if(!m) return s.replace(/v/g,'ü');
  const b=m[1],t=+m[2]; if(!t||t===5) return b.replace(/v/g,'ü');
  let i;
  if(b.includes('a')) i=b.indexOf('a');
  else if(b.includes('e')) i=b.indexOf('e');
  else if(b.includes('ou')) i=b.indexOf('o');
  else for(let k=b.length-1;k>=0;k--){ if('iouv'.includes(b[k])){i=k;break;} }
  if(i===undefined) return b;
  return (b.slice(0,i)+MARKS[b[i]][t-1]+b.slice(i+1)).replace(/v/g,'ü');
}
const base=p=>p.replace(/\d$/,'');
const toneVars=p=>shuffle([1,2,3,4].filter(t=>t!=+p.slice(-1))).map(t=>base(p)+t);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 预录音频（tools/gen_audio.py 用 MiniMax 生成，audio/manifest.js 列出有哪些文件）：
   有音频就播音频——静音拨片打开、微信里也能响；缺哪条才用系统朗读 */
const VOICE='girl-v1';
const CLIPS=new Set(((window.AUDIO_CLIPS||{})[VOICE])||[]);
const hasAudio=CLIPS.size>0, soundOK=()=>hasAudio||voiceOK;
function fnv(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
/* 文件名 = 内容的哈希，生成脚本用同样的算法 */
const clipKey=o=>o.it?`item|${o.it.c}|${o.it.p}|${o.it.w}`:o.l?`letter|${o.l}|${LETTER[o.l].c}|${LETTER[o.l].p}`:`say|${o.t.replace(/\s+/g,'')}`;
function clipURL(o){const k=fnv(clipKey(o));return CLIPS.has(k)?`audio/${VOICE}/${k}.mp3`:null;}
let player=null, playQ=[];
const warmed=new Set();
function preload(segs){if(location.protocol==='file:')return;  // 双击本地打开时浏览器不让 fetch，直接播就行
  segs.forEach(o=>{const u=clipURL(o);if(u&&!warmed.has(u)){warmed.add(u);try{fetch(u).catch(()=>{});}catch(e){}}});}
function playClips(list){
  if(!player){player=new Audio();player.setAttribute('playsinline','');player.onended=player.onerror=()=>playNext();}
  playQ=list; playNext();
}
/* 几段都用同一个 audio 元素接着播：第一段在点按里开始，iPhone 就允许后面几段自动接上 */
function playNext(){
  const c=playQ.shift(); if(!c) return;
  player.src=c.url; player.defaultPlaybackRate=player.playbackRate=c.rate;
  try{player.preservesPitch=player.webkitPreservesPitch=true;}catch(e){}
  try{const p=player.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
/* 朗读必须在孩子点按的那一刻直接开始（iPhone/iPad 的要求），所以不用任何延时；
   三句一次性排进队列，换题时 cancel() 会把整队清掉 */
function speak(text){
  stopSpeech();
  const segs=(Array.isArray(text)?text:[text]).map(t=>typeof t==='string'?{t}:t);
  const urls=segs.map(clipURL);
  if(urls.every(Boolean)) return playClips(segs.map((o,i)=>({url:urls[i],rate:o.it?SPEEDS[speedIdx].play:1})));
  if(!voiceOK||!('speechSynthesis' in window)) return;
  const parts=segs.flatMap(o=>o.it?[o.it.c,o.it.w,`${o.it.w}的${o.it.c}`].map(t=>({t})):o.l?[{t:LETTER[o.l].c}]:[o]);
  try{
    parts.forEach(o=>{
      const u=new SpeechSynthesisUtterance(o.t);
      u.lang='zh-CN';u.rate=o.rate||SPEEDS[speedIdx].rate;if(o.pitch)u.pitch=o.pitch;if(zhVoice)u.voice=zhVoice;
      speechSynthesis.speak(u);
    });
    if(speechSynthesis.paused) speechSynthesis.resume();
  }catch(e){}
}
/* iPhone 的毛病：没在念的时候也去 cancel()，紧接着的朗读会整段没声音。
   所以只在真正在念 / 排队时才 cancel */
function stopSpeech(){
  playQ=[]; if(player&&!player.paused){try{player.pause();}catch(e){}}
  try{ const ss=window.speechSynthesis; if(ss&&(ss.speaking||ss.pending)) ss.cancel(); }catch(e){}
}

/* iPhone 静音模式：网页声音默认走"铃声"通道会被静掉。
   ① Safari 17+ 支持 navigator.audioSession，直接切到"媒体播放"
   ② 旧系统：循环播放一段无声音频，让整页切到媒体通道（和音乐 App 一样） */
let silentEl=null;
function keepPlaybackSession(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(silentEl) { if(silentEl.paused) silentEl.play().catch(()=>{}); return; }
  try{
    const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    silentEl=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
    silentEl.loop=true; silentEl.setAttribute('playsinline',''); silentEl.setAttribute('x-webkit-airplay','deny');
    silentEl.play().catch(()=>{});
  }catch(e){}
}
function unlockAudio(){
  keepPlaybackSession();
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}
}
function beep(f,t0,d,type='sine',vol=.15){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+d);
}
function sfx(kind){
  if(!actx) return; const n=actx.currentTime;
  if(kind==='ok'){beep(660,n,.12);beep(990,n+.1,.2);}
  else if(kind==='bad'){beep(200,n,.28,'square',.06);}
  else if(kind==='tap'){beep(520,n,.08,'sine',.08);}
  else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>beep(f,n+i*.12,.25));}
}

let L=null;
/* 声调专练出题。tlisten 听音辨调 / tmark 看字认调：选项固定按一二三四声排；
   tplace 标调位置：把声调分别标在每个韵母字母上，只有一个对，不够 4 个就补别的声调 */
function markAt(b,i,t){return (b.slice(0,i)+MARKS[b[i]][t-1]+b.slice(i+1)).replace(/v/g,'ü');}
function makeToneQ(it,retry){
  const b=base(it.p),t=+it.p.slice(-1);
  const types=CATS.tdrill.types.filter(x=>x!=='tlisten'||soundOK());
  let type=types[Math.floor(Math.random()*types.length)];
  if(type==='tplace'){
    const ans=py(it.p), opts=[...new Set([...b].map((ch,i)=>MARKS[ch]?markAt(b,i,t):null).filter(Boolean))];
    if(opts.length>=2&&opts.includes(ans)){
      for(const u of [1,2,3,4]) if(opts.length<4&&u!==t&&!opts.includes(py(b+u))) opts.push(py(b+u));
      return {it,type,opts:shuffle(opts),ans,retry};
    }
    type='tmark';
  }
  return {it,type,opts:[1,2,3,4].map(u=>b+u),ans:it.p,retry};
}
/* 拼一拼：音节拆成声母 + 带调的韵母（三拼音节的介母算在韵母里，如 g + uāng）。
   干扰项：形近、平翘舌的声母；前后鼻音等易混韵母和同一韵母的别的声调；
   j q x y 后面的 u 再放一个 ü，练「去掉两点」 */
const INITIALS=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const CONF_INI={b:['d','p','q'],d:['b','p','t'],p:['b','q','d'],m:['n','l'],n:['m','l'],l:['n','r'],f:['t','h'],t:['f','d'],
  g:['k','h'],k:['g','h'],h:['f','k'],j:['q','x','zh'],q:['j','x','p'],x:['j','q','sh'],zh:['z','ch','j'],ch:['c','zh','q'],
  sh:['s','x','ch'],r:['l','y'],z:['zh','c','s'],c:['ch','z','s'],s:['sh','z','c'],y:['w','j'],w:['y','h']};
const CONF_FIN={an:'ang',ang:'an',en:'eng',eng:'en',in:'ing',ing:'in',uan:'uang',uang:'uan',ian:'iang',un:'ong',ong:'un',
  ui:'iu',iu:'ui',ie:'ue',ue:'ie',ei:'ie',ao:'ou',ou:'ao',uo:'o',ai:'ei',ia:'ie',iao:'iu',uai:'ai',iong:'ong',ua:'uo',e:'o',a:'o',u:'o',v:'u'};
function splitPy(p){const b=base(p),i=INITIALS.find(x=>b.startsWith(x))||'';return {ini:i,fin:b.slice(i.length),t:+p.slice(-1)};}
function makeSpellQ(it,retry){
  const {ini,fin,t}=splitPy(it.p);
  const inis=[ini];
  for(const x of shuffle((CONF_INI[ini]||[]).slice()).concat(shuffle(INITIALS.slice()))) if(inis.length<4&&!inis.includes(x)) inis.push(x);
  const fins=[fin+t], addF=f=>{if(fins.length<4&&!fins.includes(f)&&py(f)!==py(fin+t))fins.push(f);};
  if(/^[jqxy]$/.test(ini)&&fin[0]==='u') addF('v'+fin.slice(1)+t);
  if(CONF_FIN[fin]) addF(CONF_FIN[fin]+t);
  shuffle([1,2,3,4].filter(u=>u!==t)).forEach(u=>addF(fin+u));
  return {it,type:'spell',inis:shuffle(inis),fins:shuffle(fins),sel:[null,null],opts:[],ans:it.p,retry};
}
function makeQ(it,retry=false){
  if(it.cat==='tdrill') return makeToneQ(it,retry);
  if(it.cat==='spell') return makeSpellQ(it,retry);
  const types=CATS[it.cat].types.filter(t=>t!=='listen'||soundOK());
  let type=types[Math.floor(Math.random()*types.length)];
  if(type==='p2c'&&hintMode){
    // 提示模式：看拼音选图片，只用有图的字；不够就改成看字选拼音
    const pics=ITEMS[it.cat].filter(o=>o.e&&o.c!==it.c&&py(o.p)!==py(it.p)&&o.e!==it.e);
    if(!it.e||new Set(pics.map(o=>o.e)).size<3) type='c2p';
  }
  if(type==='p2c'){
    const others=ITEMS[it.cat].filter(o=>o.c!==it.c&&py(o.p)!==py(it.p)&&(!hintMode||(o.e&&o.e!==it.e)))
      .map(o=>({o,s:(it.d.includes(o.p)?3:0)+(base(o.p)===base(it.p)?2:0)+Math.random()*1.5}))
      .sort((a,b)=>b.s-a.s);
    const opts=[it.c];
    const usedE=[it.e];
    for(const {o} of others){if(opts.length>=4)break;
      if(opts.includes(o.c)||(hintMode&&usedE.includes(o.e)))continue;opts.push(o.c);usedE.push(o.e);}
    return {it,type,opts:shuffle(opts),ans:it.c,retry};
  }
  const set=[it.p];
  const add=p=>{if(set.length<4&&!set.some(x=>py(x)===py(p)))set.push(p);};
  shuffle(it.d.slice()).forEach(add);
  toneVars(it.p).forEach(add);
  it.d.forEach(d=>toneVars(d).forEach(add));
  return {it,type,opts:shuffle(set),ans:it.p,retry};
}

/* 综合考试出题：① 错过的题优先（错题本里的分量最重，以前错过、已改正的也再考）
   ② 七类每类至少一题 ③ 剩下的名额多给错得多、星星少的类型。同一个字只考一次 */
function buildExam(){
  const picked=[],usedC=new Set();
  const take=it=>{if(!it||usedC.has(it.c)||picked.length>=EXAM_LEN)return false;usedC.add(it.c);picked.push(it);return true;};
  const w=it=>{const k=it.cat+'|'+it.c;return 3*(mistakes[k]||0)+(wrongHist[k]||0);};
  let n=0;
  for(const {it} of ALL.filter(it=>w(it)>0).map(it=>({it,s:w(it)+Math.random()})).sort((a,b)=>b.s-a.s)){
    if(n>=EXAM_WRONG_MAX)break;
    // 留够名额：每类至少还能出一题
    const left=ORDER.filter(id=>id!==it.cat&&!picked.some(x=>x.cat===id)).length;
    if(picked.length+1+left>EXAM_LEN) continue;
    if(take(it))n++;
  }
  ORDER.forEach(id=>{if(!picked.some(it=>it.cat===id))take(shuffle(ITEMS[id].filter(it=>!usedC.has(it.c)))[0]);});
  const cw={};ORDER.forEach(id=>{cw[id]=1+(3-((prog[id]||{}).stars||0))+ITEMS[id].reduce((s,it)=>s+w(it),0)/3;});
  for(let g=0;picked.length<EXAM_LEN&&g<500;g++){
    let r=Math.random()*ORDER.reduce((s,id)=>s+cw[id],0),id=ORDER[ORDER.length-1];
    for(const c of ORDER){if((r-=cw[c])<0){id=c;break;}}
    take(shuffle(ITEMS[id].filter(it=>!usedC.has(it.c)))[0]);
  }
  return shuffle(picked);
}
function startLesson(mode){
  unlockAudio(); unlockSpeech();
  if(mode==='letters') return startLetters();

  if(mode==='exam') pool=buildExam();

  else if(mode==='mix'){  // 每类先抽几个，再打乱，同一个字只出一次

}

  sheet.className='sheet ok';
  sheet.innerHTML=`<div class="sheet-in"><div class="fb-title">✅ ${praise}这一组连完啦！</div>
    <div class="sheet-btns"><button class="big green" id="cont">${last?'看看成绩':'下一组 ➜'}</button></div></div>`;
  document.body.appendChild(sheet);
  document.getElementById('cont').onclick=()=>{sheet.remove();if(last)finish();else{L.ri++;letterRound();}};
}
function askQuit(){
  if(document.querySelector('.sheet')) document.querySelectorAll('.sheet').forEach(x=>x.remove());
  const sh=document.createElement('div');sh.className='sheet bad';
  const exam=L&&L.mode==='exam';
  sh.innerHTML=`<div class="sheet-in"><div class="fb-title">${exam?'要退出考试吗？':'要退出这一关吗？'}</div>
    <div class="fb-detail" style="font-size:16px">${exam?'这次考试不会算分。':'这一关的进度不会保存。'}</div>
    <div class="sheet-btns"><button class="big green" id="stay">${exam?'继续考试':'继续闯关'}</button><button class="big red" id="leave">退出</button></div></div>`;
  document.body.appendChild(sh);
  document.getElementById('stay').onclick=()=>{sh.remove(); if(L&&L.answered){next();} };
  document.getElementById('leave').onclick=()=>{sh.remove();home();};
}
/* 拼一拼：点声母、韵母放进格子，两个都放好就判断（考试里先不判断，点下一题才算） */
function pickTile(k,v){
  unlockAudio();
  const q=L.q; if(L.answered) return;
  q.sel[k]=v; if(v) sfx('tap');
  const attr=k?'f':'i';
  app.querySelectorAll(`[data-${attr}]`).forEach(b=>b.classList.toggle('sel',b.dataset[attr]===v));
  const [i,f]=q.sel, s=i&&f?i+f:null;
  document.getElementById('s0').textContent=i||''; document.getElementById('s1').textContent=f?py(f):'';
  document.getElementById('s2').textContent=s?py(s):'？';
  if(L.mode==='exam'){L.pick=s;const nb=document.getElementById('exnext');nb.disabled=!s;nb.className=s?'big blue':'big gray';return;}
  if(!s) return;
  answer({dataset:{v:s},classList:{add(){}}});
  document.getElementById('s2').classList.add(s===q.ans?'ok':'bad');
}
const PRAISE=['太棒了！','真厉害！','答对啦！','完美！','好样的！','你真聪明！'];
function answer(btn){
  unlockAudio();
  if(L.mode==='exam'){
    // 考试：先选中（可以改），点"下一题"才算数，不当场告诉对错
    app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b===btn));
    L.pick=btn.dataset.v; sfx('tap');
    const nb=document.getElementById('exnext'); nb.disabled=false; nb.className='big blue';
    return;
  }
  if(L.answered) return; L.answered=true;
  const q=L.q,it=q.it,ok=btn.dataset.v===q.ans;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.ans)b.classList.add('ok');});
  if(!ok) btn.classList.add('bad');
  if(ok){
    L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);L.done++;L.gained+=10;
    if(!q.retry)L.firstCorrect++;
    if(L.mode==='review')bumpMistake(it,-1);
    sfx('ok');
  }else{
    L.combo=0;bumpMistake(it,+1);L.queue.push(makeQ(it,true));sfx('bad');
  }
  const praise=ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'', combo=ok&&L.combo>=3?`连对 ${L.combo} 题！`:'';
  speak(ok?[cheer(praise),...(combo?[cheer(combo)]:[]),...sayItem(it)]:sayItem(it));
  const toneCat=it.cat==='tone'||it.cat==='tdrill';
  const sheet=document.createElement('div');
  sheet.className='sheet '+(ok?'ok':'bad');
  sheet.innerHTML=`<div class="sheet-in">
    <div class="fb-title">${ok?'✅ '+praise+(combo?' '+combo:''):'❌ 正确答案是：'}</div>
    <div class="fb-detail">${it.e?it.e+' ':''}<span class="han">${it.c}</span>　<span class="py" style="font-weight:700">${py(it.p)}</span>${toneCat?`<span style="font-size:15px">（${TONE_NAME[+it.p.slice(-1)]}）</span>`:''}　<span class="han">${it.w}</span></div>
    ${ok?'':`<div class="tip">💡 ${CATS[it.cat].tip}</div>`}
    ${!ok&&toneCat&&soundOK()?`<div class="tonedemo">🔈 声调小课堂：${TONE_DEMO.map((d,i)=>`<button class="spd py" data-td="${i}">${d.py}</button>`).join('')}</div>`:''}
    <div class="sheet-btns">${soundOK()?'<button class="iconbtn" id="again">🔊</button>':''}
    <button class="big ${ok?'green':'red'}" id="cont">继续</button></div></div>`;
  document.body.appendChild(sheet);
  const ag=document.getElementById('again'); if(ag) ag.onclick=()=>speak(sayItem(it));
  sheet.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>speak({t:TONE_DEMO[+b.dataset.td].c}));
  document.getElementById('cont').onclick=()=>{sheet.remove();next();};
}

function examNext(){
  if(L.pick==null) return;
  const q=L.q,ok=L.pick===q.ans;
  L.answers.push({it:q.it,type:q.type,pick:L.pick,ok});
  L.done++;
  if(ok){L.firstCorrect++;L.gained+=10;} else bumpMistake(q.it,+1);
  next();
}

/* ================= 结算 ================= */
/* 经验、连续天数、今日目标；返回是否刚好完成今日目标 */
function tally(){
  xp+=L.gained; store.set('xp',xp);
  const t=ymd(new Date()),y=ymd(new Date(Date.now()-864e5));
  if(streak.last!==t){streak.count=streak.last===y?streak.count+1:1;streak.last=t;store.set('streak',streak);}
  const td=curToday();td.lessons++;td.xp+=L.gained;store.set('today',td);
  return td.lessons===DAILY_GOAL;
}
function finish(){
  stopSpeech();
  screen='result';
  if(L.mode==='exam') return finishExam();
  const acc=L.firstCorrect/L.firstTotal, stars=acc>=.9?3:acc>=.7?2:1;
  const bonus=acc===1?20:5; L.gained+=bonus;
  if(L.mode!=='review'){const p=prog[L.mode]||{stars:0,plays:0};p.stars=Math.max(p.stars,stars);p.plays++;prog[L.mode]=p;store.set('prog',prog);}
  const goalHit=tally();
  const emo=stars===3?'🏆':stars===2?'🎉':'💪';
  const msg=LESSON_MSG[stars-1];
  app.innerHTML=`<div class="result"><div class="emo">${emo}</div><h2>${msg}</h2>
    ${starsHTML(stars,'bigstars')}
    ${goalHit?'<p style="font-weight:800;color:var(--orange);font-size:18px">🎯 今天的目标完成啦！</p>':''}
    <div class="stats">
      <div class="stat"><b style="color:#e3a400">+${L.gained}</b><span>经验</span></div>
      <div class="stat"><b style="color:var(--green-d)">${Math.round(acc*100)}%</b><span>一次答对</span></div>
      <div class="stat"><b style="color:var(--orange)">${L.maxCombo}</b><span>最多连对</span></div>
    </div>
    <div class="rbtns"><button class="big green" id="again">再玩一关</button>
    <button class="big blue" id="back">返回首页</button></div></div>`;
  const mode=L.mode;
  document.getElementById('again').onclick=()=>startLesson(mode==='review'&&!mistakeKeys().length?'mix':mode);
  document.getElementById('back').onclick=home;
  sfx('win'); if(stars===3||goalHit) confetti();
  speak([cheer(msg)].concat(goalHit?[cheer(GOAL_MSG)]:[]));
}
function finishExam(){
  const A=L.answers,n=A.length,right=A.filter(a=>a.ok).length,score=Math.round(right/n*100);
  L.gained+=score===100?20:5;
  const goalHit=tally();
  const wrong=A.filter(a=>!a.ok);
  exams.push({date:ymd(new Date()),score,n,wrong:wrong.map(a=>a.it.cat+'|'+a.it.c)});
  exams=exams.slice(-30); store.set('exams',exams);
  const lv=score>=90?3:score>=70?2:score>=60?1:0, emo=['💪','👍','🎉','🏆'][lv], msg=EXAM_MSG[lv];
  const cats=ORDER.map(id=>{const as=A.filter(a=>a.it.cat===id);return {id,t:as.length,r:as.filter(a=>a.ok).length};}).filter(x=>x.t);
  const pickTxt=a=>a.type==='p2c'?`<span class="han">${a.pick}</span>`:`<span class="py">${py(a.pick)}</span>`;
  app.innerHTML=`<div class="result"><div class="emo">${emo}</div><h2>${msg}</h2>
    <div class="score">${score}<span>分</span></div>
    <div class="hint">${n} 题答对 ${right} 题</div>
    ${goalHit?'<p style="font-weight:800;color:var(--orange);font-size:18px">🎯 今天的目标完成啦！</p>':''}
    <div class="sec">📊 各类得分</div>
    ${cats.map(x=>`<div class="catrow"><span class="cn">${CATS[x.id].emoji} ${CATS[x.id].name}</span>
      <div class="bar"><i class="${x.r/x.t<.7?'low':''}" style="width:${x.r/x.t*100}%"></i></div><span class="cv">${x.r}/${x.t}</span></div>`).join('')}
    ${wrong.length?`<div class="sec">❌ 错了 ${wrong.length} 题（点一下听读音）</div>
    <div class="wlist">${wrong.map((a,i)=>`<button class="witem" data-w="${i}"><span class="we">${a.it.e||'🔊'}</span>
      <span class="wh han">${a.it.c}</span><span class="wd">
      <span class="yes py">${py(a.it.p)}</span>　<span class="han">${a.it.w}</span><br>
      <span class="hint">你选的：<span class="no">${pickTxt(a)}</span></span></span></button>`).join('')}</div>`:''}
    <div class="rbtns" style="margin-top:22px">${wrong.length?'<button class="big orange" id="rev">📒 马上练错题</button>':''}
    <button class="big green" id="again">再考一次</button>
    <button class="big blue" id="back">返回首页</button></div></div>`;
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>speak(sayItem(wrong[+b.dataset.w].it)));
  const rv=document.getElementById('rev'); if(rv) rv.onclick=()=>startLesson(mistakeKeys().length?'review':'mix');
  document.getElementById('again').onclick=()=>startLesson('exam');
  document.getElementById('back').onclick=home;
  sfx('win'); if(score>=90||goalHit) confetti();
  speak([cheer(`${score}分！`),cheer(msg)].concat(goalHit?[cheer(GOAL_MSG)]:[]));
}
function confetti(){
  const e=['⭐','🎉','✨','🌟','🎈'];
  for(let i=0;i<32;i++){const s=document.createElement('div');s.className='confetti';
    s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.8+Math.random()*1.8)+'s';s.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4500);}
}

/* ================= 键盘 ================= */
document.addEventListener('keydown',e=>{
  if(screen!=='lesson')return;
  const c=document.getElementById('cont');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click();return;}
  const x=document.getElementById('exnext');
  if(x&&!x.disabled&&(e.key==='Enter'||e.key===' ')){e.preventDefault();x.click();return;}
  if(/^[1-4]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click();}
});

if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
home();
</script>
